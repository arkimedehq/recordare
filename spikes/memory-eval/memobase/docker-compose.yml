# Memobase server for the spike (pgvector + redis + api). config.yaml is generated by
# `setup_memobase.py` from the spike .env and is gitignored (contains the LLM key).
name: memeval-memobase
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memobase
      POSTGRES_PASSWORD: memobase
      POSTGRES_DB: memobase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memobase -d memobase"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "memobase"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "memobase", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: ghcr.io/memodb-io/memobase:latest
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql://memobase:memobase@db:5432/memobase
      REDIS_URL: redis://:memobase@redis:6379/0
      ACCESS_TOKEN: memeval
      PROJECT_ID: memeval
      API_HOSTS: http://localhost:8019
      USE_CORS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8019:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
