requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=1.50",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "numpy>=1.26",
  "graphiti-core[falkordb]>=0.30.2",
  "memobase>=0.0.27",
  "fastapi>=0.142.2",
  "uvicorn>=0.54.0",
  "sentence-transformers>=6.1.0",
  "psutil>=7.2.2",
  "mcp>=2.3.0",
  "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false
