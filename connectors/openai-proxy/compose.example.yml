#
# Recordare memory proxy next to a chat platform. Copy the service into the platform's compose file and point the
# platform's OpenAI-compatible provider at http://recordare-proxy:8788/v1 (README → Platforms).
services:
  recordare-proxy:
    build:
      context: ../..                       # the Recordare repository root
      dockerfile: connectors/openai-proxy/Dockerfile
    restart: unless-stopped
    environment:
      UPSTREAM_BASE_URL: https://api.deepseek.com/v1   # any OpenAI-compatible provider
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}            # unset = the platform's own key goes through
      PROXY_API_KEY: ${PROXY_API_KEY:-}                # optional: the key the platform must present
      RECORDARE_URL: http://recordare:8080             # or http://host.docker.internal:8080
      RECORDARE_API_KEY: ${RECORDARE_API_KEY}          # rk_… (client key) or rp_… (personal token)
      RECORDARE_USER: my-assistant                     # client key: the proxy's one memory (D50)
      # SELF_USERS: anythingllm:1                      # the account holder (the memory's "I"); others are participants
      # MEMORY_PER: workspace                          # or user: one memory per platform user (before D50)
      TZ: Europe/Rome
      # USER_MAP: '{"anythingllm:1":"andrea"}'
      # END_IDLE_SECONDS: "600"
    # No published port: only the platform (same network) should reach it.
    # ports: ["127.0.0.1:8788:8788"]
