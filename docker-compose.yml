# Recordare — local development stack (v1 home / research profile).
# `docker compose up -d db redis` for development; the service runs with `npm run start:dev`.
# Host ports avoid Arkimede's (5432 / 6379).
name: recordare
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recordare
      POSTGRES_PASSWORD: recordare
      POSTGRES_DB: recordare
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordare -d recordare"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  service:
    profiles: ["app"]   # docker compose --profile app up -d
    build:
      context: ./service
    env_file: ./service/.env
    environment:
      DATABASE_URL: postgres://recordare:recordare@db:5432/recordare
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  db-data:
