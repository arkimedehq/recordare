# Recordare — standalone profile: the service with its own Postgres (pgvector), Redis and embedding server.
# Use deploy/install.sh (it writes deploy/.env); start by hand with:  docker compose -p recordare up -d
name: recordare

services:
  recordare:
    build: { context: ../service, dockerfile: Dockerfile }
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      embedder: { condition: service_started }
    ports: ["${RECORDARE_BIND:-127.0.0.1}:${RECORDARE_PORT:-8090}:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: recordare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/install.sh}
      POSTGRES_DB: recordare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordare -d recordare"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Hugging Face text-embeddings-inference (Apache-2.0): OpenAI-compatible /v1/embeddings for BAAI/bge-m3, the model
  # Recordare was measured with. CPU image per architecture, chosen by install.sh (EMBEDDER_IMAGE).
  embedder:
    image: ${EMBEDDER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]
    volumes: [embedcache:/data]

volumes:
  pgdata:
  redisdata:
  embedcache:
