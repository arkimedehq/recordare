name: ci

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: recordare
          POSTGRES_PASSWORD: recordare
          POSTGRES_DB: recordare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recordare -d recordare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://recordare:recordare@localhost:5432/recordare_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            service/package-lock.json
            packages/client/package-lock.json
      # The conformance suite runs the client library (packages/client) against the service.
      - run: npm ci
        working-directory: packages/client
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The Claude Code and Codex connectors share one hook script (two byte-identical copies).
      - run: sh connectors/check-shared.sh
      - run: bash -n connectors/codex/install.sh
